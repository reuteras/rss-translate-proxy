services:
  rss-translate-proxy:
    container_name: rss-translate-proxy
    build: .
    labels:
      - com.monitoring.enable=true
    ports:
      - "127.0.0.1:8086:8086"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
  rss-translate-worker:
    container_name: rss-translate-worker
    build: .
    labels:
      - com.monitoring.enable=true
    command: ["python", "worker.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
  libretranslate:
    # latest is built from main, so it can be newer than the last release
    # (2026-11-24: latest = v1.10.0); pinned by digest so updates arrive as
    # Dependabot PRs.
    image: docker.io/libretranslate/libretranslate:latest@sha256:e8e858a1f1db7bef3b80531d2bbef0762aa1ed7143f4565f5f5254585e69912a
    container_name: rss-translate-libretranslate
    labels:
      - com.monitoring.enable=true
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - LT_DISABLE_WEB_UI=true
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,uk
      - LT_WORKERS=1
    volumes:
      - ./libretranslate-data:/home/libretranslate/.local/share
