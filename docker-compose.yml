services:
  rss-translate-proxy:
    container_name: rss-translate-proxy
    build: .
    labels:
      - com.monitoring.enable=true
    ports:
      - "127.0.0.1:8086:8086"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
  rss-translate-worker:
    container_name: rss-translate-worker
    build: .
    labels:
      - com.monitoring.enable=true
    command: ["python", "worker.py"]
    # The image's healthcheck probes the web app on :8086, which the worker
    # doesn't serve. Check the worker's own heartbeat deadline instead
    # (see heartbeat_ok in worker.py).
    healthcheck:
      # Keep this free of quotes/parentheses: podman-compose turns the list into
      # a shell string without quoting it correctly.
      test: ["CMD", "python", "worker.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
  libretranslate:
    # upstream's image plus Debian security updates; the pinned image is in
    # libretranslate/Dockerfile
    build: ./libretranslate
    container_name: rss-translate-libretranslate
    labels:
      - com.monitoring.enable=true
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - LT_DISABLE_WEB_UI=true
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,uk
      - LT_WORKERS=1
    volumes:
      # Named volume, not a bind mount: on first use Docker and podman copy the
      # image's .local, owned by the libretranslate user (1032), so models can be
      # updated. A bind-mounted host directory is owned by the host user, which
      # rootless podman maps to root, and LibreTranslate can't write to it.
      - libretranslate-local:/home/libretranslate/.local

volumes:
  libretranslate-local:
